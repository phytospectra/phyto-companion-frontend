name: Frontend CI
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCKS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # Advisory only: 17 transitive findings (prismjs via @mdxeditor/editor /
      # react-syntax-highlighter; sharp's bundled libvips via Next's image
      # pipeline) have no non-breaking fix at the pinned majors. Logged here
      # so new HIGH findings stay visible; see docs/UI-ACCEPTANCE-2026-11-12.md
      # and the completion ledger.
      - name: Dependency advisory (npm audit, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high
